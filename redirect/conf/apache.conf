ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex callback.php

    # Zugriffe ohne Query-String protokollieren, damit der Autorisierungscode nicht im Log landet.
    LogFormat "%h %t \"%m %U %H\" %>s %b" noquery
    CustomLog /proc/self/fd/1 noquery
    ErrorLog /proc/self/fd/2
</VirtualHost>
