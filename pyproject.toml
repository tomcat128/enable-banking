[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enable-banking-sync"
version = "0.1.0"
description = "Ruft Kontoumsätze automatisiert über die Enable Banking API ab und speichert sie lokal in SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
enable-banking = "enable_banking_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enable_banking_sync = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
