services:
  enable-banking:
    build: .
    image: fehrenbacher/banking:latest
    container_name: enable-banking
    restart: unless-stopped
    # Optional: Alles Nötige wird in der Weboberfläche eingetragen (Compose >= 2.24).
    env_file:
      - path: .env
        required: false
    ports:
      # Weboberfläche: http://<server>:8080/
      - "${EB_WEB_BIND:-0.0.0.0}:${EB_WEB_HOST_PORT:-8080}:8080"
    volumes:
      # Datenverzeichnis (Datenbank inkl. Einstellungen; wird beim ersten Start angelegt)
      - ${EB_DATA_PATH:-./data}:/data
      # Optional: Schlüsseldatei statt Eingabe in der Weboberfläche
      # - ./secrets/private.pem:/secrets/private.pem:ro
